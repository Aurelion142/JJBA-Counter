<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoJo Manga Collector</title>
  
  <!-- PWA & Mobile Meta -->
  <meta name="theme-color" content="#120e24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JoJo Tracker">
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/JoJo%27s_Bizarre_Adventure_logo.png/320px-JoJo%27s_Bizarre_Adventure_logo.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0b0813;
      --card-bg: rgba(23, 17, 38, 0.85);
      --card-border: rgba(147, 51, 234, 0.2);
      
      --jojo-purple: #9333ea;
      --jojo-pink: #ec4899;
      --jojo-gold: #eab308;
      --jojo-green: #22c55e;
      --jojo-red: #ef4444;
      
      --part1-color: #10b981;
      --part2-color: #ef4444;
      --part3-color: #3b82f6;
      --part4-color: #a855f7;
      --part5-color: #eab308;
      --part6-color: #ec4899;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(147, 51, 234, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    header {
      background: rgba(11, 8, 19, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Bebas Neue', cursive;
      font-size: 2rem;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #eab308, #ec4899, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn {
      background: rgba(147, 51, 234, 0.2);
      border: 1px solid var(--jojo-purple);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: var(--jojo-purple);
    }
    .stat-card.owned::before { background: var(--jojo-green); }
    .stat-card.wishlist::before { background: var(--jojo-gold); }

    .stat-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--jojo-purple), var(--jojo-pink));
      width: 0%;
      transition: width 0.5s ease;
    }

    .controls {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 15px 10px 40px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      outline: none;
    }

    .search-box i {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
    }

    .filter-btn.active {
      background: var(--jojo-purple);
      color: white;
      border-color: var(--jojo-purple);
    }

    .part-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    .part-header {
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
    }

    .part-title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .part-badge {
      width: 12px; height: 25px; border-radius: 3px;
    }

    .part-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.5rem;
    }

    .part-stats {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .volumes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
      padding: 15px;
    }

    .volume-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .volume-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .cover-container {
      width: 100%;
      height: 210px;
      background: #120e24;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .volume-card:hover .cover-img {
      transform: scale(1.05);
    }

    .cover-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e1b4b, #311b92);
      color: #fff;
      font-family: 'Bebas Neue', cursive;
      font-size: 1.4rem;
      text-align: center;
      padding: 10px;
    }

    .cover-fallback i {
      font-size: 2rem;
      margin-bottom: 5px;
      color: var(--jojo-gold);
    }

    .volume-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
      text-align: center;
      background: rgba(11, 8, 19, 0.9);
    }

    .volume-number {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .volume-title {
      font-weight: 600;
      font-size: 0.85rem;
      margin: 3px 0 8px 0;
      line-height: 1.2;
    }

    .volume-status-tag {
      font-size: 0.7rem;
      padding: 4px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-owned {
      border-color: var(--jojo-green) !important;
    }
    .status-owned .volume-status-tag {
      background: var(--jojo-green);
      color: #000;
    }

    .status-wishlist {
      border-color: var(--jojo-gold) !important;
    }
    .status-wishlist .volume-status-tag {
      background: var(--jojo-gold);
      color: #000;
    }

    .status-missing {
      opacity: 0.8;
    }
    .status-missing .volume-status-tag {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #171126;
      border: 1px solid var(--jojo-purple);
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-close {
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.2rem;
    }

    .status-options {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .status-btn {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.8rem;
      text-align: center;
    }

    .status-btn.active[data-status="owned"] { background: var(--jojo-green); color: #000; font-weight: 700; }
    .status-btn.active[data-status="wishlist"] { background: var(--jojo-gold); color: #000; font-weight: 700; }
    .status-btn.active[data-status="missing"] { background: var(--jojo-red); color: #fff; font-weight: 700; }

    .notes-textarea {
      width: 100%;
      height: 80px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #fff;
      padding: 8px;
      font-family: inherit;
      resize: none;
      margin-bottom: 15px;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo">
        <i class="fa-solid fa-star"></i> JOJO MANGA TRACKER
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn" onclick="exportData()"><i class="fa-solid fa-download"></i></button>
        <button class="btn" onclick="importData()"><i class="fa-solid fa-upload"></i></button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Συνολική Πρόοδος</div>
        <div class="stat-value">
          <span id="total-percent">0%</span>
          <span style="font-size: 0.8rem; color: var(--text-muted);" id="total-count-text">0 / 0 Τόμοι</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="total-progress-bar"></div>
        </div>
      </div>

      <div class="stat-card owned">
        <div class="stat-title">Στην Κατοχή</div>
        <div class="stat-value" id="owned-count" style="color: var(--jojo-green);">0</div>
        <div style="font-size: 0.8rem; color: var(--text-muted);">Τόμοι στη βιβλιοθήκη</div>
      </div>

      <div class="stat-card wishlist">
        <div class="stat-title">Wishlist / Λείπουν</div>
        <div class="stat-value">
          <span id="wishlist-count" style="color: var(--jojo-gold);">0</span>
          <span style="font-size: 1rem; color: var(--text-muted);">/</span>
          <span id="missing-count" style="color: var(--jojo-red);">0</span>
        </div>
        <div style="font-size: 0.8rem; color: var(--text-muted);">Επιθυμία / Λείπουν</div>
      </div>
    </div>

    <div class="controls">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Αναζήτηση..." oninput="renderApp()">
      </div>
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all" onclick="setStatusFilter('all')">Όλα</button>
        <button class="filter-btn" data-filter="owned" onclick="setStatusFilter('owned')"><i class="fa-solid fa-check"></i> Έχω</button>
        <button class="filter-btn" data-filter="wishlist" onclick="setStatusFilter('wishlist')"><i class="fa-solid fa-star"></i> Επιθυμία</button>
        <button class="filter-btn" data-filter="missing" onclick="setStatusFilter('missing')"><i class="fa-solid fa-xmark"></i> Λείπουν</button>
      </div>
    </div>

    <div id="parts-container"></div>
  </div>

  <div class="modal-overlay" id="volume-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="modal-vol-title">Volume Title</div>
        <i class="fa-solid fa-xmark modal-close" onclick="closeModal()"></i>
      </div>
      
      <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;">Κατάσταση:</div>
      <div class="status-options">
        <div class="status-btn" data-status="owned" onclick="setVolumeStatus('owned')">Έχω</div>
        <div class="status-btn" data-status="wishlist" onclick="setVolumeStatus('wishlist')">Θέλω</div>
        <div class="status-btn" data-status="missing" onclick="setVolumeStatus('missing')">Δεν έχω</div>
      </div>

      <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px;">Σημειώσεις:</div>
      <textarea class="notes-textarea" id="modal-notes" placeholder="Γράψε σημειώσεις εδώ..."></textarea>

      <button class="btn" style="width: 100%; justify-content: center;" onclick="saveModalData()">Αποθήκευση</button>
    </div>
  </div>

  <footer>
    <p>JoJo's Bizarre Adventure Hardcover Collector Tracker</p>
    <p style="margin-top: 5px; opacity: 0.6;"><a href="#" onclick="resetDataConfirmation()" style="color: var(--jojo-red); text-decoration: none;">Επαναφορά Δεδομένων</a></p>
  </footer>

          { id: "p6-v6", title: "Volume 6", number: 6, cover: "https://images.openlibrary.org/b/isbn/9781974740314-M.jpg" },
          { id: "p6-v7", title: "Volume 7", number: 7, cover: "https://images.openlibrary.org/b/isbn/9781974740321-M.jpg" },
          { id: "p6-v8", title: "Volume 8", number: 8, cover: "https://images.openlibrary.org/b/isbn/9781974740338-M.jpg" }
        ]
      }
    ];

    let userState = {};
    let currentFilter = 'all';
    let selectedVolumeId = null;

    function handleImageError(imgElement, partTitle, volNumber) {
      const container = imgElement.parentElement;
      container.innerHTML = `
        <div class="cover-fallback">
          <i class="fa-solid fa-book-open"></i>
          <div>VOL. ${volNumber}</div>
        </div>
      `;
    }

    function loadState() {
      const saved = localStorage.getItem('jojo_manga_collection');
      if (saved) {
        try { userState = JSON.parse(saved); } catch(e) { userState = {}; }
      }
    }

    function saveState() {
      localStorage.setItem('jojo_manga_collection', JSON.stringify(userState));
      renderApp();
    }

    window.setStatusFilter = function(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      renderApp();
    };

    window.openModal = function(volId) {
      selectedVolumeId = volId;
      let volObj = null;
      jojoData.forEach(p => {
        const found = p.volumes.find(v => v.id === volId);
        if (found) volObj = found;
      });

      if (!volObj) return;

      document.getElementById('modal-vol-title').innerText = volObj.title;
      const status = userState[volId]?.status || 'missing';
      const notes = userState[volId]?.notes || '';

      document.querySelectorAll('.status-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.status === status);
      });

      document.getElementById('modal-notes').value = notes;
      document.getElementById('volume-modal').classList.add('active');
    };

    window.closeModal = function() {
      document.getElementById('volume-modal').classList.remove('active');
      selectedVolumeId = null;
    };

    window.setVolumeStatus = function(status) {
      document.querySelectorAll('.status-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.status === status);
      });
    };

    window.saveModalData = function() {
      if (!selectedVolumeId) return;
      const activeBtn = document.querySelector('.status-btn.active');
      const status = activeBtn ? activeBtn.dataset.status : 'missing';
      const notes = document.getElementById('modal-notes').value;

      userState[selectedVolumeId] = { status, notes };
      saveState();
      closeModal();
    };

    window.exportData = function() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userState));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `jojo_collection_backup.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    window.importData = function() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.readAsText(file, 'UTF-8');
        reader.onload = readerEvent => {
          try {
            userState = JSON.parse(readerEvent.target.result);
            saveState();
            alert('Τα δεδομένα φορτώθηκαν επιτυχώς!');
          } catch(err) {
            alert('Σφάλμα κατά τη φόρτωση του αρχείου.');
          }
        }
      }
      input.click();
    };

    window.resetDataConfirmation = function() {
      if (confirm('Είσαι σίγουρος ότι θέλεις να διαγράψεις όλη την πρόοδο;')) {
        userState = {};
        saveState();
      }
    };

    function renderApp() {
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      const partsContainer = document.getElementById('parts-container');
      partsContainer.innerHTML = '';

      let totalVolumes = 0;
      let ownedCount = 0;
      let wishlistCount = 0;
      let missingCount = 0;

      jojoData.forEach(part => {
        let partOwned = 0;
        let visibleVolumesCount = 0;

        const partCard = document.createElement('div');
        partCard.className = 'part-section';

        let volumesHTML = '';

        part.volumes.forEach(vol => {
          totalVolumes++;
          const volState = userState[vol.id] || { status: 'missing', notes: '' };
          const status = volState.status;

          if (status === 'owned') ownedCount++;
          else if (status === 'wishlist') wishlistCount++;
          else missingCount++;

          if (status === 'owned') partOwned++;

          if (currentFilter !== 'all' && status !== currentFilter) return;
          if (searchQuery && !vol.title.toLowerCase().includes(searchQuery) && !part.title.toLowerCase().includes(searchQuery)) return;

          visibleVolumesCount++;

          let statusText = 'ΛΕΙΠΕΙ';
          if (status === 'owned') statusText = 'ΕΧΩ';
          if (status === 'wishlist') statusText = 'ΘΕΛΩ';

          volumesHTML += `
            <div class="volume-card status-${status}" onclick="openModal('${vol.id}')">
              <div class="cover-container">
                <img class="cover-img" src="${vol.cover}" alt="${vol.title}" loading="lazy" onerror="handleImageError(this, '${part.title}', ${vol.number})">
              </div>
              <div class="volume-info">
                <div>
                  <div class="volume-number">Vol. ${vol.number}</div>
                  <div class="volume-title">${vol.title}</div>
                </div>
                <div class="volume-status-tag">${statusText}</div>
              </div>
            </div>
          `;
        });

        if (visibleVolumesCount > 0) {
          const partPercent = Math.round((partOwned / part.volumes.length) * 100);
          partCard.innerHTML = `
            <div class="part-header">
              <div class="part-title-area">
                <div class="part-badge" style="background: ${part.color}"></div>
                <div class="part-title">${part.title}</div>
              </div>
              <div class="part-stats">${partOwned} / ${part.volumes.length} (${partPercent}%)</div>
            </div>
            <div class="volumes-grid">
              ${volumesHTML}
            </div>
          `;
          partsContainer.appendChild(partCard);
        }
      });

      const totalPercent = totalVolumes > 0 ? Math.round((ownedCount / totalVolumes) * 100) : 0;
      document.getElementById('total-percent').innerText = `${totalPercent}%`;
      document.getElementById('total-count-text').innerText = `${ownedCount} / ${totalVolumes} Τόμοι`;
      document.getElementById('total-progress-bar').style.width = `${totalPercent}%`;
      
      document.getElementById('owned-count').innerText = ownedCount;
      document.getElementById('wishlist-count').innerText = wishlistCount;
      document.getElementById('missing-count').innerText = missingCount;
    }

    loadState();
    renderApp();
  </script>
</body>
</html>
